version: '3.8'
services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_restaurante
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build: ./backend
    container_name: restaurante_backend
    restart: always
    ports:
      - "8001:8001"
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: restaurante_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongodb_data:
